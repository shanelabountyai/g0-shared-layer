[project]
name = "g0-shared-layer"
version = "0.1.0"
description = "Shared Capability Layer (G0): six governed capabilities behind one MCP server with versioned contracts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
judge = ["anthropic>=0.60"]

[project.scripts]
g0-shared-layer = "shared_layer.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.uv]
required-version = ">=0.5"
